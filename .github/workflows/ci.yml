name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend lint & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: srm-admin-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: srm-admin-frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint:check
      - name: Build
        run: npm run build

  ai-service:
    name: AI service tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: srm-ai-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: srm-ai-service/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: python -m pytest -q

  deploy:
    name: Trigger Jenkins deploy
    needs: [frontend, ai-service]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Jenkins
        env:
          JENKINS_URL: ${{ secrets.JENKINS_URL }}
          JENKINS_TOKEN: ${{ secrets.JENKINS_TOKEN }}
        run: |
          if [ -z "$JENKINS_URL" ] || [ -z "$JENKINS_TOKEN" ]; then
            echo "JENKINS_URL / JENKINS_TOKEN secrets not set" >&2
            exit 1
          fi
          curl -fsS -X POST \
            "$JENKINS_URL/job/Vanpine%20SRM/buildWithParameters" \
            --data-urlencode "token=$JENKINS_TOKEN" \
            --data-urlencode "COMMIT=${{ github.sha }}"
          echo "Jenkins build triggered for ${{ github.sha }}"
